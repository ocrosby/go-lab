version: "2"
run:
  tests: true
  modules-download-mode: readonly
linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    errcheck:
      exclude-functions:
        - fmt.Print
        - fmt.Println
        - fmt.Printf
        - fmt.Fprintln
        - fmt.Fprintf
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
    rules:
      # Pedagogical "before" packages under 10-panic-and-recover intentionally
      # demonstrate broken patterns; do not lint them like production code.
      - path: lessons/10-panic-and-recover/.*/before/.*\.go
        linters:
          - errcheck
          - govet
          - ineffassign
          - staticcheck
          - unused
      # Lessons prioritize educational clarity over defensive style. Errors
      # unchecked in demonstration handlers and helper closures are acceptable
      # here; production code lives under templates/ and lessons/14-production-api.
      - path: lessons/
        linters:
          - errcheck
          - unused
          - ineffassign
          - staticcheck
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/ocrosby/go-lab
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
