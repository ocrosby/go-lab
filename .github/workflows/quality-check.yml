name: Quality Check & Learning Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.26'

jobs:
  test:
    name: Test root module
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      # The `10-panic-and-recover/*/before` packages intentionally demonstrate
      # unsafe patterns; their tests are expected to panic. Exclude them from
      # the CI test run — the matching `after/` packages are still tested.
      - name: Test with race detector
        run: |
          go list ./... \
            | grep -v '10-panic-and-recover/.*/before$' \
            | xargs go test -race -count=1 -coverprofile=coverage.out -covermode=atomic

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-root
          path: coverage.out
          retention-days: 14

  # The two submodules under lessons/ have their own go.mod. This job vets and
  # builds them so integration bugs are caught, but does not run `go test` for
  # 14-production-api yet — that suite has known-failing tests independent of
  # any workflow change and needs its own fix-up pass before it can gate CI.
  submodules:
    name: Build submodules
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - lessons/13-design-patterns
          - lessons/14-production-api
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Download dependencies
        working-directory: ${{ matrix.module }}
        run: go mod download

      - name: Vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

      - name: Build
        working-directory: ${{ matrix.module }}
        run: go build ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ['.', 'lessons/14-production-api']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            go.sum
            lessons/14-production-api/go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: ${{ matrix.module }}

  vulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Scan root module
        run: govulncheck ./...

      - name: Scan production-api submodule
        working-directory: lessons/14-production-api
        run: govulncheck ./...
